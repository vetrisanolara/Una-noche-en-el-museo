
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Un museo fuera de tiempo</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #0c0808;
            width: 100%;
            height: 100vh;
            overflow: hidden;
        }

        .portada {
            width: 100%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
        }

        .portada img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            transition: opacity 0.4s ease;
        }

        .portada:hover img {
            opacity: 0.88;
        }

    </style>
</head>

<body>

    <a class="portada"
       href="https://editor.p5js.org/vetrisanolara/sketches/qqIbOgbwK"
       aria-label="Entrar al museo fuera de tiempo">

        <img src="886680.png"
             alt="Un museo fuera de tiempo - Acompañá a Van Gogh en este viaje">

    </a>

</body>
</html>
